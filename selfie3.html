<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diesel Selfie Mode</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Import model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }

        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #three_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            /* Start invisible for fade-in animation */
            transition: opacity 0.8s ease;
        }

        .input_video {
            display: none;
        }

        #status {
            position: absolute;
            color: cyan;
            z-index: 3;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            /* Hidden unless needed for debug */
        }

        /* Back button (Left Top Arrow) */
        #back_btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            opacity: 0;
            /* Start invisible for fade-in animation */
            transition: opacity 0.6s ease;
        }

        /* Capture Button (Middle Bottom) */
        #capture_container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            /* Start invisible for fade-in animation */
            transition: opacity 0.6s ease;
        }

        #capture_btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 4px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s;
        }

        #capture_btn:active {
            transform: translateX(-50%) scale(0.95);
            /* Maintain Translate */
        }

        #capture_inner {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: white;
        }

        /* Switch Camera / AR Button (Right Bottom) */
        #ar_switch_container {
            position: absolute;
            bottom: 40px;
            right: 20px;
            z-index: 20;
            width: 50px;
            height: 50px;
            opacity: 0;
            /* Start invisible for fade-in animation */
            transition: opacity 0.6s ease;
        }

        #ar_switch_btn {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            color: white;
        }

        /* Restart Camera Button (Left Bottom) */
        #restart_camera_container {
            position: absolute;
            bottom: 40px;
            left: 20px;
            z-index: 20;
            width: 50px;
            height: 50px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #restart_camera_container.visible {
            opacity: 1;
            pointer-events: all;
        }

        #restart_camera_btn {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 50, 50, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 100, 100, 0.6);
            cursor: pointer;
            color: white;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                background: rgba(255, 50, 50, 0.3);
            }

            50% {
                transform: scale(1.05);
                background: rgba(255, 80, 80, 0.4);
            }
        }

        /* Switch Model Button (Center Bottom, above capture button) */
        #switch_model_container {
            position: absolute;
            bottom: 140px;
            /* Above the capture button */
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            opacity: 0;
            /* Start invisible for fade-in animation */
            transition: opacity 0.6s ease;
        }

        #switch_model_btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            color: white;
            padding: 10px 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            /* Better Hebrew font support */
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        #switch_model_btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        /* Icon Styles */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* PHOTOBOOTH MODE STYLES */
        #photobooth_overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #photobooth_overlay.active {
            pointer-events: all;
            opacity: 1;
        }

        #photobooth_black_drop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        #polaroid_container {
            position: absolute;
            top: -120vh;
            /* Start further up to hide taller images */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: #fff;
            padding: 15px 15px 80px 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        #polaroid_image {
            width: 100%;
            /* aspect-ratio removed to allow dynamic sizing */
            background: #000;
            display: block;
            filter: contrast(1.1) saturate(1.1);
        }

        #polaroid_text {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            font-family: "Covered By Your Grace", cursive;
            font-size: 28px;
            color: #222;
            transform: rotate(-2deg) skewX(-2deg);
            opacity: 0.85;
            white-space: nowrap;
        }

        /* Animation Classes */
        .printing {
            animation: printScroll 4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes printScroll {
            0% {
                top: -120vh;
            }

            5% {
                top: -120vh;
            }

            /* Pulse 1 */
            15% {
                top: -100vh;
            }

            20% {
                top: -100vh;
            }

            /* Pulse 2 */
            30% {
                top: -80vh;
            }

            35% {
                top: -80vh;
            }

            /* Pulse 3 */
            45% {
                top: -60vh;
            }

            50% {
                top: -60vh;
            }

            /* Pulse 4 */
            60% {
                top: -40vh;
            }

            65% {
                top: -40vh;
            }

            /* Pulse 5 (Print Out) */
            100% {
                top: 10%;
                transform: translateX(-50%) rotate(-3deg);
            }
        }

        #post_capture_ui {
            position: absolute;
            bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            opacity: 0;
            transition: opacity 1s ease 2.5s;
        }

        #post_capture_ui.visible {
            opacity: 1;
        }

        .action_btn {
            background: white;
            color: black;
            border: none;
            width: 60px;
            height: 60px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .action_btn:active {
            transform: scale(0.95);
        }

        .action_btn.secondary {
            background: white;
            color: black;
            border: none;
        }

        /* Tooltip Styles */
        #tooltip_container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 30;
            max-width: 340px;
            width: 85%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            padding: 16px 20px 20px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #tooltip_container.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: all;
        }

        #tooltip_text {
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.5;
            text-align: center;
            margin: 0;
            padding: 28px 30px 0 10px;
            direction: rtl;
        }

        #tooltip_close {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            font-size: 16px;
            font-weight: bold;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }

        #tooltip_close:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        #tooltip_close:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.35);
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="container">
        <div id="status">Initializing...</div>

        <!-- Left Arrow Icon Button -->
        <a href="index.html" id="back_btn">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
        </a>

        <!-- Switch Model Button (Center Bottom, above capture) -->
        <div id="switch_model_container">
            <div id="switch_model_btn">החלף אפקט</div>
        </div>

        <!-- Photobooth Overlay -->
        <div id="photobooth_overlay">
            <div id="photobooth_black_drop"></div>
            <div id="polaroid_container">
                <img id="polaroid_image" src="" alt="Capture">
                <div id="polaroid_text"></div>
            </div>
            <div id="post_capture_ui">
                <button id="pb_take_again" class="action_btn secondary" aria-label="Take Again">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path
                            d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                    </svg>
                </button>
                <button id="pb_share" class="action_btn" aria-label="Share">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M16 5l-4-4-4 4m4-4v13m7-3v5h-14v-5" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>
        </div>

        <canvas id="three_canvas"></canvas>

        <!-- 1. Capture Button (Middle Bottom) -->
        <div id="capture_container">
            <div id="capture_btn">
                <div id="capture_inner"></div>
            </div>
        </div>

        <!-- 2. Switch Camera Icon Button (Right Bottom) -->
        <div id="ar_switch_container">
            <div id="ar_switch_btn">
                <!-- Camera Flip Icon -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5H5l2.5-2.5L10 13H8c0 2.21 1.79 4 4 4 .58 0 1.14-.13 1.65-.36l1.14 1.14C13.95 17.93 13.02 18 12 18zm2.5-2.5L12 13h2c0-2.21-1.79-4-4-4-.58 0-1.14.13-1.65.36L7.21 8.22C8.05 8.07 8.98 8 10 8c2.76 0 5 2.24 5 5h2l-2.5 2.5z"
                        fill="currentColor" />
                </svg>
            </div>
        </div>

        <!-- 3. Restart Camera Button (Left Bottom) -->
        <div id="restart_camera_container">
            <div id="restart_camera_btn">
                <!-- Refresh Icon -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
                </svg>
            </div>
        </div>

        <a id="download_anchor" style="display:none"></a>

        <!-- Tooltip -->
        <div id="tooltip_container">
            <button id="tooltip_close" aria-label="Close">×</button>
            <p id="tooltip_text">תזיזו ותגדילו את המודל כדי לקבל את התמונה המושלמת!</p>
        </div>
    </div>
    <video class="input_video" playsinline muted></video>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // =========================================================
        //  === CONFIGURATION ===
        // =========================================================

        const MODEL_WIDTH_PCT = 0.9;
        const ROTATION_FIX_Y = 0.0;
        const VERTICAL_OFFSET = 0.0;
        const HORIZONTAL_OFFSET = 0.0;

        const BLOOM_THRESHOLD = 1.5;
        const BLOOM_STRENGTH = 2.0;
        const BLOOM_RADIUS = 0.5;

        const NEON_COLOR = 0xEB292D;
        const NEON_INTENSITY_SCALAR = 10.0;

        // Model switching state
        let currentModel = 'object'; // 'neon' or 'object'
        let objectModel = null;
        let objectModelBaseScale = 1.0; // Store the initial base scale
        let objectModelTransform = {
            position: { x: 0, y: 0, z: 0 },
            scale: 1.0
        };

        // Interaction state for object model
        let interactionState = {
            isDragging: false,
            isScaling: false,
            startTouch: null,
            lastTouch: null,
            initialDistance: 0,
            initialScale: 1.0
        };

        // Animation state for model switching
        let modelSwitchAnimation = {
            isAnimating: false,
            startTime: 0,
            duration: 400, // ms
            fromModel: null,
            toModel: null,
            fromOpacity: 1.0,
            toOpacity: 0.0
        };

        // Initial appearance animation for D model on page load
        let initialAppearAnimation = {
            isAnimating: false,
            startTime: 0,
            duration: 1000, // ms - longer for smooth entrance
            hasPlayed: false
        };

        // Track loading state
        let modelsLoaded = {
            neon: false,
            object: false
        };



        // =========================================================
        //  === SETUP ===
        // =========================================================

        const threeCanvas = document.getElementById('three_canvas');
        const statusText = document.getElementById('status');
        const videoElement = document.querySelector('.input_video');

        let width = window.innerWidth;
        let height = window.innerHeight;

        // =========================================================
        //  === THREE.JS SCENE ===
        // =========================================================

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // =========================================================
        //  === VIDEO BACKGROUND ===
        // =========================================================

        const videoTexture = new THREE.VideoTexture(videoElement);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const videoGeometry = new THREE.PlaneGeometry(1, 1);
        const videoMaterial = new THREE.MeshStandardMaterial({
            map: videoTexture,
            side: THREE.DoubleSide,
            roughness: 1,
            metalness: 0,
            color: 0xffffff
        });
        const videoPlane = new THREE.Mesh(videoGeometry, videoMaterial);
        videoPlane.position.z = -10;
        scene.add(videoPlane);

        // =========================================================
        //  === NEON SIGN ===
        // =========================================================

        const loader = new GLTFLoader();
        let loadedModel = null;
        let pointLight = null;

        const neonMaterial = new THREE.MeshBasicMaterial({
            color: new THREE.Color(NEON_COLOR).multiplyScalar(NEON_INTENSITY_SCALAR)
        });

        // Load neon sign model
        loader.load('./model.gltf', function (gltf) {
            loadedModel = gltf.scene;

            loadedModel.traverse((child) => {
                if (child.isMesh) child.material = neonMaterial;
            });

            const box = new THREE.Box3().setFromObject(loadedModel);
            const center = box.getCenter(new THREE.Vector3());
            loadedModel.position.sub(center);

            pointLight = new THREE.PointLight(NEON_COLOR, 100, 50);
            pointLight.position.set(0, 0, 2);
            loadedModel.add(pointLight);

            loadedModel.visible = false; // Hidden by default, start with object model
            scene.add(loadedModel);
            fitModelToCamera();

            // Mark neon model as loaded
            modelsLoaded.neon = true;
            checkAllLoaded();

        }, undefined, function (error) {
            console.error('Error loading neon model:', error);
        });

        // Load BLENDER_TEST_UV_COMPRESSED.glb model
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
        const objectLoader = new GLTFLoader();
        objectLoader.setDRACOLoader(dracoLoader);

        objectLoader.load('./BLENDER_TEST_UV_COMPRESSED.glb', function (gltf) {
            objectModel = gltf.scene;

            // Center and scale the object model
            const box = new THREE.Box3().setFromObject(objectModel);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            objectModel.position.sub(center);

            // Scale to reasonable size (similar to neon sign)
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 3; // Adjust as needed
            const scale = targetSize / maxDim;
            objectModel.scale.set(scale, scale, scale);

            // Store the base scale for future transformations
            objectModelBaseScale = scale;

            // Position in center of screen
            objectModel.position.set(0, 0, 0);
            objectModel.visible = true; // Visible by default (D mode starts first)

            // Enhance materials - add subtle emissive glow and set up for animation
            objectModel.traverse((child) => {
                if (child.isMesh && child.material) {
                    // Minimal emissive color for subtle enhancement
                    if (child.material.emissive) {
                        child.material.emissive.setHex(0x6699cc); // Gentle blue emissive
                        child.material.emissiveIntensity = 0.0; // Very subtle glow
                    }

                    // Set up for initial appearance animation
                    child.material.transparent = true;
                    child.material.opacity = 0; // Start invisible

                    // Ensure the material updates
                    child.material.needsUpdate = true;
                }
            });

            scene.add(objectModel);
            console.log('Object model loaded successfully');

            // Mark object model as loaded
            modelsLoaded.object = true;
            checkAllLoaded();

        }, undefined, function (error) {
            console.error('Error loading object model:', error);
        });

        // Function to check if all models are loaded and start fade-in sequence
        function checkAllLoaded() {
            if (modelsLoaded.neon && modelsLoaded.object) {
                console.log('All models loaded, starting fade-in sequence');

                // Start camera and UI fade-in after a short delay
                setTimeout(() => {
                    // Fade in camera/canvas
                    const canvas = document.getElementById('three_canvas');
                    if (canvas) canvas.style.opacity = '1';

                    // Fade in all controls
                    const backBtn = document.getElementById('back_btn');
                    const captureContainer = document.getElementById('capture_container');
                    const arSwitchContainer = document.getElementById('ar_switch_container');
                    const switchModelContainer = document.getElementById('switch_model_container');

                    if (backBtn) backBtn.style.opacity = '1';
                    if (captureContainer) captureContainer.style.opacity = '1';
                    if (arSwitchContainer) arSwitchContainer.style.opacity = '1';
                    if (switchModelContainer) switchModelContainer.style.opacity = '1';

                    // After camera fades in (800ms), start D model fade-in
                    setTimeout(() => {
                        initialAppearAnimation.isAnimating = true;
                        initialAppearAnimation.startTime = performance.now();

                        // Show tooltip after model finishes appearing (1000ms animation + 500ms delay)
                        setTimeout(() => {
                            const tooltip = document.getElementById('tooltip_container');
                            if (tooltip) {
                                tooltip.classList.add('visible');
                            }
                        }, 1500); // Wait for model to finish animating
                    }, 1200); // 800ms camera fade + 400ms pause
                }, 300); // Small initial delay
            }
        }


        const ambientLight = new THREE.AmbientLight(0xadd8e6, 2.0); // BRIGHT blue-tinted ambient light
        scene.add(ambientLight);

        // Enhanced lighting setup for D model (object model)
        const objectLights = []; // Array to store lights for animation

        // Key Light - Main directional light from front-top (bright blue-white)
        const keyLight = new THREE.DirectionalLight(0xccddff, 5.0);
        keyLight.position.set(3, 4, 5);
        scene.add(keyLight);
        objectLights.push(keyLight);

        // Fill Light - Strong blue light from opposite side
        const fillLight = new THREE.DirectionalLight(0x6699ff, 3.5);
        fillLight.position.set(-3, 2, 3);
        scene.add(fillLight);
        objectLights.push(fillLight);

        // Rim Light - Blue-tinted back light for edge definition
        const rimLight = new THREE.DirectionalLight(0x88bbff, 3.0);
        rimLight.position.set(0, 3, -5);
        scene.add(rimLight);
        objectLights.push(rimLight);

        // Accent Point Lights - Add depth and visual interest
        const accentLight1 = new THREE.PointLight(0xff3366, 6.0, 15);
        accentLight1.position.set(-2, 1, 2);
        scene.add(accentLight1);
        objectLights.push(accentLight1);

        const accentLight2 = new THREE.PointLight(0x3366ff, 8.0, 20); // SUPER bright blue accent
        accentLight2.position.set(2, -1, 2);
        scene.add(accentLight2);
        objectLights.push(accentLight2);

        // Start with lights at zero intensity (since we start with object model but will animate in)
        objectLights.forEach(light => {
            light.intensity = light.intensity; // Keep initial values for reference
            light.userData.baseIntensity = light.intensity; // Store base intensity
        });

        // =========================================================
        //  === POST-PROCESSING ===
        // =========================================================

        const renderScene = new RenderPass(scene, camera);

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(width, height), 1.5, 0.4, 0.85);
        bloomPass.threshold = BLOOM_THRESHOLD;
        bloomPass.strength = BLOOM_STRENGTH;
        bloomPass.radius = BLOOM_RADIUS;

        const renderTarget = new THREE.WebGLRenderTarget(width, height, {
            type: THREE.HalfFloatType,
            format: THREE.RGBAFormat,

        // =========================================================

        // Camera facing mode state
        let currentFacingMode = 'user'; // Start with front camera (selfie)

        async function startCamera(facingMode = 'user') {
            // Stop existing tracks to ensure clean restart
            if (videoElement.srcObject) {
                const tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                videoElement.srcObject = stream;
                await videoElement.play();
                currentFacingMode = facingMode; // Update state on success
            } catch (err) {
                console.error("Error accessing camera:", err);
            }
        }
        startCamera();

        // Camera health monitoring
        let cameraIssueDetected = false;
        const restartCameraContainer = document.getElementById('restart_camera_container');
        const restartCameraBtn = document.getElementById('restart_camera_btn');

        function showRestartButton() {
            if (!cameraIssueDetected) {
                cameraIssueDetected = true;
                restartCameraContainer.classList.add('visible');
            }

        function hideRestartButton() {
            cameraIssueDetected = false;
            restartCameraContainer.classList.remove('visible');
        }

        // Manual restart button click handler
        restartCameraBtn.addEventListener('click', () => {
            console.log('Manual camera restart triggered');
            hideRestartButton();
            startCamera();
        });

        // Monitor video play state
        let lastFrameTime = videoElement.currentTime;
        let frameFrozenCount = 0;

        setInterval(() => {
            if (videoElement.srcObject && !videoElement.paused) {
                if (videoElement.currentTime === lastFrameTime) {
                    frameFrozenCount++;
                    if (frameFrozenCount > 3) { // 3 seconds frozen
                        console.log('Camera appears frozen (no new frames)');
                        showRestartButton();
                    }
                } else {
                    frameFrozenCount = 0;
                    lastFrameTime = videoElement.currentTime;
                    if (cameraIssueDetected) {
                        hideRestartButton();
                    }
                }
            }
        }, 1000);

        // Re-initialize camera when returning to the tab (e.g. from AR view)
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // iOS AR Fix: Clean up viewer on return to ensure fresh session next time
                const arViewer = document.getElementById('ar_model_viewer');
                if (arViewer) arViewer.remove();

                // Small delay to let the page fully restore
                setTimeout(() => {
                    const stream = videoElement.srcObject;
                    const isPaused = videoElement.paused;
                    const isEnded = videoElement.ended;

                    let needsRestart = false;

                    if (!stream || !stream.active) {
                        console.log('No active stream detected after visibility change');
                        needsRestart = true;
                    } else if (isPaused || isEnded) {
                        // Try to resume first
                        videoElement.play().catch(() => {
                            console.log("Resume failed, restarting camera...");
                            needsRestart = true;
                        });
                    } else {
                        // Check individual tracks
                        const tracks = stream.getVideoTracks();
                        if (tracks.length === 0) {
                            console.log('No video tracks found');
                            needsRestart = true;
                        } else if (tracks[0].readyState === 'ended' || tracks[0].muted) {
                            console.log('Video track ended or muted');
                            needsRestart = true;
                        }
                    }

                    if (needsRestart) {
                        console.log("Camera needs restart after visibility change.");
                        showRestartButton();
                        // Auto-restart after showing button
                        setTimeout(() => {
                            startCamera().then(() => {
                                hideRestartButton();
                            });
                        }, 500);
                    }
                }, 300);
            }
        });

        // Also listen to page focus events (backup for iOS)
        window.addEventListener('focus', () => {

                    setTimeout(() => {

                            hideRestartButton();
                        });
                    }, 500);
                }

        // =========================================================
        //  === POSITIONING LOGIC ===
        // =========================================================

        function fitModelToCamera() {
            if (!loadedModel) return;

            loadedModel.rotation.set(0, 0, 0);
            loadedModel.scale.set(1, 1, 1);
            loadedModel.position.set(0, 0, 0);
            loadedModel.updateMatrixWorld(true);

            const dist = camera.position.z;
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * dist;
            const visibleWidth = visibleHeight * camera.aspect;

            const box = new THREE.Box3().setFromObject(loadedModel);
            const size = new THREE.Vector3();
            box.getSize(size);
            const center = new THREE.Vector3();
            box.getCenter(center);

            let scaleFactor = (visibleWidth / size.x) * MODEL_WIDTH_PCT;
            loadedModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

            const scaledMaxZ = box.max.z * scaleFactor;
            loadedModel.position.z = -scaledMaxZ;

            const scaledTopY = box.max.y * scaleFactor;
            const targetTopY = visibleHeight / 2;
            const topPadding = visibleHeight * 0.05;

            loadedModel.position.y = (targetTopY - scaledTopY - topPadding) + VERTICAL_OFFSET;

            const scaledCenterX = center.x * scaleFactor;
            loadedModel.position.x = -scaledCenterX + HORIZONTAL_OFFSET;

            loadedModel.rotation.y = ROTATION_FIX_Y;
        }

        function updateVideoPlane() {
            if (videoElement.readyState < videoElement.HAVE_ENOUGH_DATA) return;

            const videoW = videoElement.videoWidth;
            const videoH = videoElement.videoHeight;
            const videoAspect = videoW / videoH;
            const screenAspect = width / height;

            const distance = camera.position.z - videoPlane.position.z;
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * distance;
            const visibleWidth = visibleHeight * camera.aspect;

            let scaleX, scaleY;

            if (screenAspect > videoAspect) {
                scaleX = visibleWidth;
                scaleY = visibleWidth / videoAspect;
            } else {
                scaleY = visibleHeight;
                scaleX = visibleHeight * videoAspect;
            }

            // Only flip horizontally for front camera (user), not back camera (environment)
            const flipX = currentFacingMode === 'user' ? -1 : 1;
            videoPlane.scale.set(flipX * scaleX, scaleY, 1);
        }

        function handleResize() {
            width = window.innerWidth;
            height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            composer.setSize(width, height);

            fitModelToCamera();
            updateVideoPlane();
        }

        window.addEventListener('resize', handleResize);
        videoElement.addEventListener('loadedmetadata', updateVideoPlane);

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.005;

            const flicker = Math.random() > 0.9 ? Math.random() * 0.5 : 0;
            const pulse = Math.sin(time * 2) * 0.1;

            bloomPass.strength = 2.0 + pulse + flicker;

            // Only animate point light when neon sign is active and not during transition
            if (pointLight && currentModel === 'neon' && !modelSwitchAnimation.isAnimating) {
                pointLight.intensity = 100.0 + (pulse * 20) + (flicker * 30);
            }

            // Animate object lights when object model is active and not during transition
            if (currentModel === 'object' && !modelSwitchAnimation.isAnimating && !initialAppearAnimation.isAnimating && objectLights.length > 0) {
                // Subtle pulsing for accent lights
                const slowPulse = Math.sin(time * 1.5) * 0.15;
                const fastPulse = Math.sin(time * 3) * 0.08;

                // Animate accent point lights with subtle pulsing
                if (objectLights[3]) { // accentLight1 (pink)
                    objectLights[3].intensity = objectLights[3].userData.baseIntensity * (1 + slowPulse);
                }
                if (objectLights[4]) { // accentLight2 (blue)
                    objectLights[4].intensity = objectLights[4].userData.baseIntensity * (1 + fastPulse);
                }
            }

            // Handle initial appearance animation for D model on first load
            if (initialAppearAnimation.isAnimating && initialAppearAnimation.startTime > 0) {
                const elapsed = performance.now() - initialAppearAnimation.startTime;
                const progress = Math.min(elapsed / initialAppearAnimation.duration, 1.0);

                // Ease-out cubic for smooth deceleration
                const easeProgress = 1 - Math.pow(1 - progress, 3);

                // Fade in opacity
                const fadeInOpacity = easeProgress;

                // Scale animation - start at 0.8, end at 1.0
                const scaleProgress = 0.8 + (0.2 * easeProgress);

                if (objectModel) {
                    // Apply opacity to all materials
                    objectModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.opacity = fadeInOpacity;
                        }
                    });

                    // Apply scale animation
                    const baseScale = objectModelBaseScale * objectModelTransform.scale;
                    objectModel.scale.set(baseScale * scaleProgress, baseScale * scaleProgress, baseScale * scaleProgress);
                }

                // Fade in object lights
                objectLights.forEach(light => {
                    light.intensity = light.userData.baseIntensity * fadeInOpacity;
                });

                // Animation complete
                if (progress >= 1.0) {
                    initialAppearAnimation.isAnimating = false;
                    initialAppearAnimation.hasPlayed = true;

                    // Reset to final state
                    if (objectModel) {
                        objectModel.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.opacity = 1.0;
                            }
                        });
                        const finalScale = objectModelBaseScale * objectModelTransform.scale;
                        objectModel.scale.set(finalScale, finalScale, finalScale);
                    }
                    objectLights.forEach(light => {
                        light.intensity = light.userData.baseIntensity;
                    });
                }
            }

            // Handle model switch animation
            if (modelSwitchAnimation.isAnimating) {
                const elapsed = performance.now() - modelSwitchAnimation.startTime;
                const progress = Math.min(elapsed / modelSwitchAnimation.duration, 1.0);

                // Ease-in-out cubic function for smooth animation
                const easeProgress = progress < 0.5
                    ? 4 * progress * progress * progress
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                // Calculate opacity for fading models
                const fadeOutOpacity = 1.0 - easeProgress;
                const fadeInOpacity = easeProgress;

                // Apply opacity to models
                if (modelSwitchAnimation.fromModel === 'neon' && loadedModel) {
                    loadedModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.opacity = fadeOutOpacity;
                        }
                    });
                } else if (modelSwitchAnimation.fromModel === 'object' && objectModel) {
                    objectModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.opacity = fadeOutOpacity;
                        }
                    });
                }

                if (modelSwitchAnimation.toModel === 'neon' && loadedModel) {
                    loadedModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.opacity = fadeInOpacity;
                        }
                    });
                } else if (modelSwitchAnimation.toModel === 'object' && objectModel) {
                    // Add subtle scale animation for incoming model
                    const scaleProgress = 0.95 + (0.05 * easeProgress);
                    const baseScale = objectModelBaseScale * objectModelTransform.scale;
                    objectModel.scale.set(baseScale * scaleProgress, baseScale * scaleProgress, baseScale * scaleProgress);

                    objectModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            child.material.opacity = fadeInOpacity;
                        }
                    });
                }

                // Gradually transition bloom effect and point light
                if (modelSwitchAnimation.toModel === 'neon') {
                    bloomPass.strength = (2.0 + pulse + flicker) * fadeInOpacity;
                    if (pointLight) {
                        pointLight.intensity = (100.0 + (pulse * 20) + (flicker * 30)) * fadeInOpacity;
                    }
                    // Fade out object lights
                    objectLights.forEach(light => {
                        light.intensity = light.userData.baseIntensity * fadeOutOpacity;
                    });
                } else {
                    bloomPass.strength = (2.0 + pulse + flicker) * fadeOutOpacity;
                    if (pointLight) {
                        pointLight.intensity = (100.0 + (pulse * 20) + (flicker * 30)) * fadeOutOpacity;
                    }
                    // Fade in object lights
                    objectLights.forEach(light => {
                        light.intensity = light.userData.baseIntensity * fadeInOpacity;
                    });
                }

                // Animation complete
                if (progress >= 1.0) {
                    modelSwitchAnimation.isAnimating = false;
                    currentModel = modelSwitchAnimation.toModel;

                    // Hide the old model and reset opacity for visible model
                    if (currentModel === 'neon') {
                        if (objectModel) objectModel.visible = false;
                        if (loadedModel) {
                            loadedModel.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    child.material.opacity = 1.0;
                                }
                            });
                        }
                        bloomPass.enabled = true;
                        bloomPass.strength = 2.0 + pulse + flicker;
                        // Turn off object lights when showing neon model
                        objectLights.forEach(light => {
                            light.intensity = 0;
                        });
                    } else {
                        if (loadedModel) loadedModel.visible = false;
                        if (objectModel) {
                            // Reset scale to final value
                            const finalScale = objectModelBaseScale * objectModelTransform.scale;
                            objectModel.scale.set(finalScale, finalScale, finalScale);
                            objectModel.traverse((child) => {
                                if (child.isMesh && child.material) {
                                    child.material.opacity = 1.0;
                                }
                            });
                        }
                        bloomPass.enabled = false;
                        // Turn off point light when showing object model
                        if (pointLight) {
                            pointLight.intensity = 0;
                        }
                        // Restore object lights to full intensity
                        objectLights.forEach(light => {
                            light.intensity = light.userData.baseIntensity;
                        });
                    }
                }
            }

            updateVideoPlane();
            composer.render();
        }
        animate();

        // =========================================================
        //  === MODEL SWITCHING LOGIC ===
        // =========================================================

        function switchToModel(modelType) {
            // Prevent switching if already animating
            if (modelSwitchAnimation.isAnimating) return;

            // Don't animate if already on this model
            if (modelType === currentModel) return;

            // Start animation
            modelSwitchAnimation.isAnimating = true;
            modelSwitchAnimation.startTime = performance.now();
            modelSwitchAnimation.fromModel = currentModel;
            modelSwitchAnimation.toModel = modelType;

            // Make both models visible for cross-fade
            if (loadedModel) loadedModel.visible = true;
            if (objectModel) objectModel.visible = true;

            // Set up materials for opacity animation
            if (loadedModel) {
                loadedModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.transparent = true;
                    }
                });
            }
            if (objectModel) {
                objectModel.traverse((child) => {
                    if (child.isMesh && child.material) {
                        child.material.transparent = true;
                    }
                });
            }

            // Apply saved transform to object model if switching to it
            if (modelType === 'object' && objectModel) {
                objectModel.position.set(
                    objectModelTransform.position.x,
                    objectModelTransform.position.y,
                    objectModelTransform.position.z
                );
                const finalScale = objectModelBaseScale * objectModelTransform.scale;
                objectModel.scale.set(finalScale, finalScale, finalScale);
            }

            // Enable bloom pass when switching to neon (so it can fade in)
            if (modelType === 'neon') {
                bloomPass.enabled = true;
            }
        }

        // Switch Model Button Handler
        const switchModelBtn = document.getElementById('switch_model_btn');
        switchModelBtn.addEventListener('click', () => {
            const newModel = currentModel === 'neon' ? 'object' : 'neon';
            switchToModel(newModel);
            console.log(`Switched to ${newModel} model`);
        });

        // =========================================================
        //  === INTERACTIVE CONTROLS FOR OBJECT MODEL ===
        // =========================================================

        // Helper functions
        function getTouchCenter(touches) {
            let x = 0, y = 0;
            for (let i = 0; i < touches.length; i++) {
                x += touches[i].clientX;
                y += touches[i].clientY;
            }
            return { x: x / touches.length, y: y / touches.length };
        }

        function getTouchDistance(touch1, touch2) {
            const dx = touch2.clientX - touch1.clientX;
            const dy = touch2.clientY - touch1.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getTouchAngle(touch1, touch2) {
            return Math.atan2(
                touch2.clientY - touch1.clientY,
                touch2.clientX - touch1.clientX
            );
        }

        function screenToWorld(screenX, screenY) {
            const rect = threeCanvas.getBoundingClientRect();
            const x = ((screenX - rect.left) / rect.width) * 2 - 1;
            const y = -((screenY - rect.top) / rect.height) * 2 + 1;

            const distance = camera.position.z;
            const vFOV = THREE.MathUtils.degToRad(camera.fov);
            const visibleHeight = 2 * Math.tan(vFOV / 2) * distance;
            const visibleWidth = visibleHeight * camera.aspect;

            return {
                x: x * visibleWidth / 2,
                y: y * visibleHeight / 2
            };
        }

        // Touch event handlers
        threeCanvas.addEventListener('touchstart', (e) => {
            if (currentModel !== 'object' || !objectModel) return;

            e.preventDefault();

            if (e.touches.length === 1) {
                // Single touch - drag to move
                interactionState.isDragging = true;
                const touch = e.touches[0];
                const worldPos = screenToWorld(touch.clientX, touch.clientY);
                interactionState.startTouch = worldPos;
                interactionState.lastTouch = worldPos;
            } else if (e.touches.length === 2) {
                // Two fingers - scale
                interactionState.isDragging = false;
                interactionState.isScaling = true;

                const distance = getTouchDistance(e.touches[0], e.touches[1]);
                interactionState.initialDistance = distance;
                interactionState.initialScale = objectModelTransform.scale;
            }
        }, { passive: false });

        threeCanvas.addEventListener('touchmove', (e) => {
            if (currentModel !== 'object' || !objectModel) return;

            e.preventDefault();

            if (e.touches.length === 1 && interactionState.isDragging) {
                // Move object
                const touch = e.touches[0];
                const worldPos = screenToWorld(touch.clientX, touch.clientY);

                const deltaX = worldPos.x - interactionState.lastTouch.x;
                const deltaY = worldPos.y - interactionState.lastTouch.y;

                objectModelTransform.position.x += deltaX;
                objectModelTransform.position.y += deltaY;

                objectModel.position.x = objectModelTransform.position.x;
                objectModel.position.y = objectModelTransform.position.y;

                interactionState.lastTouch = worldPos;
            } else if (e.touches.length === 2 && interactionState.isScaling) {
                // Scale object
                const distance = getTouchDistance(e.touches[0], e.touches[1]);
                const scaleChange = distance / interactionState.initialDistance;
                let newScale = interactionState.initialScale * scaleChange;

                // Clamp scale between 0.5x and 3x
                newScale = Math.max(0.5, Math.min(3.0, newScale));
                objectModelTransform.scale = newScale;

                // Apply scale using stored base scale
                const finalScale = objectModelBaseScale * newScale;
                objectModel.scale.set(finalScale, finalScale, finalScale);
            }
        }, { passive: false });

        threeCanvas.addEventListener('touchend', (e) => {
            if (currentModel !== 'object') return;

            interactionState.isDragging = false;
            interactionState.isScaling = false;
        });

        // Mouse event handlers (for desktop)
        let mouseDown = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        threeCanvas.addEventListener('mousedown', (e) => {
            if (currentModel !== 'object' || !objectModel) return;

            mouseDown = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        threeCanvas.addEventListener('mousemove', (e) => {
            if (currentModel !== 'object' || !objectModel || !mouseDown) return;

            const deltaX = e.clientX - lastMouseX;
            const deltaY = e.clientY - lastMouseY;

            const worldDeltaX = (deltaX / width) * 20; // Adjust sensitivity
            const worldDeltaY = -(deltaY / height) * 20;

            objectModelTransform.position.x += worldDeltaX;
            objectModelTransform.position.y += worldDeltaY;

            objectModel.position.x = objectModelTransform.position.x;
            objectModel.position.y = objectModelTransform.position.y;

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        threeCanvas.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        threeCanvas.addEventListener('mouseleave', () => {
            mouseDown = false;
        });

        // Mouse wheel for scaling
        threeCanvas.addEventListener('wheel', (e) => {
            if (currentModel !== 'object' || !objectModel) return;

            e.preventDefault();

            const scaleDelta = e.deltaY > 0 ? 0.95 : 1.05;
            let newScale = objectModelTransform.scale * scaleDelta;

            // Clamp scale
            newScale = Math.max(0.5, Math.min(3.0, newScale));
            objectModelTransform.scale = newScale;

            // Apply scale using stored base scale
            const finalScale = objectModelBaseScale * newScale;
            objectModel.scale.set(finalScale, finalScale, finalScale);
        }, { passive: false });

        async function capturePolaroidAsImage() {
            try {
                // Get the polaroid container element
                const polaroid = document.getElementById('polaroid_container');
                if (!polaroid) return null;

                // Get the computed bounds
                const rect = polaroid.getBoundingClientRect();

                const canvas = document.createElement('canvas');
                const scale = window.devicePixelRatio || 1;
                canvas.width = rect.width * scale;
                canvas.height = rect.height * scale;

                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);

                // Fill white background (polaroid frame)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, rect.width, rect.height);

                // Draw the polaroid image
                const polaroidImg = document.getElementById('polaroid_image');
                if (polaroidImg && polaroidImg.complete) {
                    const imgPadding = 15; // Match CSS padding
                    const imgWidth = rect.width - (imgPadding * 2);
                    const imgHeight = (polaroidImg.naturalHeight / polaroidImg.naturalWidth) * imgWidth;

                    ctx.drawImage(polaroidImg, imgPadding, imgPadding, imgWidth, imgHeight);
                }

                // Draw the text
                const polaroidText = document.getElementById('polaroid_text');
                if (polaroidText) {
                    const text = polaroidText.innerHTML.replace(/<[^>]*>/g, ''); // Strip HTML for now

                    ctx.save();
                    ctx.font = '28px "Covered By Your Grace", cursive';
                    ctx.fillStyle = '#222222';
                    ctx.textAlign = 'center';
                    ctx.globalAlpha = 0.85;

                    // Apply the transform (rotation and skew)
                    ctx.translate(rect.width / 2, rect.height - 25);
                    ctx.rotate(-2 * Math.PI / 180);
                    ctx.transform(1, 0, -0.035, 1, 0, 0); // skewX

                    // Handle the colored "DIESEL" text
                    const textContent = polaroidText.textContent;
                    const dieselMatch = textContent.match(/^DIESEL/);

                    if (dieselMatch) {
                        // Measure text to position it correctly
                        const fullText = textContent;
                        const fullWidth = ctx.measureText(fullText).width;
                        const dieselWidth = ctx.measureText('DIESEL').width;
                        const restText = textContent.substring(6); // Everything after "DIESEL"

                        const startX = -fullWidth / 2;

                        // Draw "DIESEL" in red
                        ctx.fillStyle = '#ff0000';
                        ctx.fillText('DIESEL', startX + dieselWidth / 2, 0);

                        // Draw the rest in black
                        ctx.fillStyle = '#222222';
                        ctx.fillText(restText, startX + dieselWidth + ctx.measureText(restText).width / 2, 0);
                    } else {
                        // Draw the whole text normally
                        ctx.fillText(textContent, 0, 0);
                    }

                    ctx.restore();
                }

                // Convert canvas to blob
                return new Promise((resolve) => {
                    canvas.toBlob((blob) => {
                        resolve(blob);
                    }, 'image/png');
                });

            } catch (error) {
                console.error('Error capturing polaroid:', error);
                return null;
            }
        }


        // Camera Switch Logic
        const arSwitchBtn = document.getElementById('ar_switch_btn');

        arSwitchBtn.addEventListener('click', () => {
            // Toggle between front (user) and back (environment) cameras
            const newFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            console.log(`Switching camera from ${currentFacingMode} to ${newFacingMode}`);
            startCamera(newFacingMode);
        });

        // Capture Button Click - Triggers Photobooth Mode
        captureBtn.addEventListener('click', () => {
            // 1. Capture immediately
            const canvas = getCompositeCanvas();

            // 2. Fade to black
            photoboothOverlay.classList.add('active');

            canvas.toBlob(blob => {
                currentPhotoBlob = blob;
                const url = URL.createObjectURL(blob);
                polaroidImage.src = url;

                // Update text with current date
                const now = new Date();
                const dateStr = `${now.getDate()}.${now.getMonth() + 1}.${now.getFullYear()}`;
                document.getElementById('polaroid_text').innerHTML = `<span style="color: red;">DIESEL</span> IS DENIM ${dateStr}`;

                // 3. Start Animation Sequence
                polaroidContainer.classList.remove('printing');
                void polaroidContainer.offsetWidth; // trigger reflow
                polaroidContainer.classList.add('printing');

                // Show UI Buttons after animation
                postCaptureUi.classList.add('visible');

            }, 'image/png');
        });

        pbTakeAgainBtn.addEventListener('click', () => {
            postCaptureUi.classList.remove('visible');
            photoboothOverlay.classList.remove('active');
            polaroidContainer.classList.remove('printing');

            if (polaroidImage.src) {
                URL.revokeObjectURL(polaroidImage.src);
                polaroidImage.src = '';
            }
            currentPhotoBlob = null;
        });

        pbShareBtn.addEventListener('click', async () => {
            if (currentPhotoBlob) {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = String(now.getFullYear()).slice(-2);
                const filename = `Diesel Selfie ${d}.${m}.${y}.png`;

                // Capture the polaroid container (with frame and text)
                const polaroidBlob = await capturePolaroidAsImage();
                if (polaroidBlob) {
                    shareMedia(polaroidBlob, filename);
                } else {
                    // Fallback to original image if capture fails
                    shareMedia(currentPhotoBlob, filename);
                }
            }
        });

        // Tooltip close button
        const tooltipClose = document.getElementById('tooltip_close');
        const tooltipContainer = document.getElementById('tooltip_container');

        tooltipClose.addEventListener('click', () => {
            tooltipContainer.classList.remove('visible');
        });

    </script>
</body>

</html>
